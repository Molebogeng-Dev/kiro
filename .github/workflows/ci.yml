# iSgela CI (GitHub Actions)
#
# Only testing is switched on. The lint, security, package, release, and deploy
# jobs are written out in full but commented, so enabling one is a matter of
# deleting the comment markers rather than working out what it should have said.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs write access to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Not a secret, and deliberately obvious about it.
  #
  # The test suite supplies its own throwaway key, but `check` and
  # `makemigrations` are not tests: they load the real settings module, which
  # refuses to start without a key. That refusal is a feature worth keeping, so
  # CI provides a value rather than the code being loosened to allow an empty
  # one. Nothing here signs anything that outlives the job.
  SECRET_KEY: ci-throwaway-key-not-used-to-sign-anything

jobs:
  # ------------------------------------------------------------------------- #
  # test
  # ------------------------------------------------------------------------- #

  # The fast, hermetic run. No database server, no network, no credentials: the
  # settings module swaps in in-memory SQLite, in-memory file storage, and a
  # fake OpenRouter key whenever the test runner is what is executing.
  test-sqlite:
    name: Tests (in-memory SQLite)
    runs-on: ubuntu-latest

    env:
      # `manage.py check` imports the settings module, which builds DATABASES
      # from this whether or not anything connects to it. Nothing in this job
      # does: the suite uses in-memory SQLite. It points at a closed local port
      # with a one second timeout, so if something ever did try to connect it
      # would fail immediately and visibly rather than hanging.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable&connect_timeout=1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Run the suite
        run: python manage.py test --verbosity 2

  # The same suite against a real Postgres, so anything SQLite cannot catch is
  # still covered. An ephemeral service container rather than Supabase: no
  # credentials, no interference between concurrent runs, and it exercises the
  # database teardown path that Supabase's pooler blocks.
  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: isgela_ci
          POSTGRES_USER: isgela
          # An ephemeral service container on the runner. Not a secret.
          POSTGRES_PASSWORD: isgela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isgela -d isgela_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_ON_POSTGRES: "True"
      # sslmode=disable because the parser defaults to `require` for Supabase,
      # and a throwaway service container has no TLS.
      DATABASE_URL: postgresql://isgela:isgela@localhost:5432/isgela_ci?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run here rather than in the SQLite job because this consults the
      # database for migration history. Against a reachable database it is
      # silent and meaningful; against a placeholder it warns and proves little.
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run

      - name: Run the suite against Postgres
        run: python manage.py test --verbosity 2

  # The same suite against the real Supabase instance.
  #
  # Skips itself unless the SUPABASE_TEST_DATABASE_URL secret is set, and never
  # fails the workflow, because it depends on a third party being up and on
  # free-tier quota. --keepdb is required: Supabase's pooler holds a session
  # open, which stops Django from dropping the test database afterwards.
  test-supabase:
    name: Tests (live Supabase, optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      TEST_ON_POSTGRES: "True"
      DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}

    steps:
      - name: Skip if no Supabase credentials are configured
        if: env.DATABASE_URL == ''
        run: echo "SUPABASE_TEST_DATABASE_URL is not set; skipping this job."

      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''

      - uses: actions/setup-python@v6
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite against Supabase
        if: env.DATABASE_URL != ''
        run: python manage.py test --keepdb --verbosity 2

